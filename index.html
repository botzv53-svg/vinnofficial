<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>VINZ SHOP x JUSTIN APK</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

<style>

/* =========================
   DASAR
========================= */

*{
  box-sizing:border-box;
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#050507;
  color:#fff;
  font-family:'Poppins',sans-serif;
}

h1,h2,h3{
  font-family:'Orbitron',sans-serif;
}


/* =========================
   LOADING VINZ SHOP
========================= */

#loading{
  position:fixed;
  inset:0;
  z-index:99999;
  overflow:hidden;
  background:#020207;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:opacity .5s ease,visibility .5s ease;
}

#loading.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.loader-bg{
  position:absolute;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(
      circle,
      rgba(0,255,245,.12),
      rgba(100,0,255,.08) 35%,
      #020207 70%
    );
}

.grid{
  position:absolute;
  inset:-60%;

  background-image:
    linear-gradient(
      rgba(0,255,245,.08) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(0,255,245,.08) 1px,
      transparent 1px
    );

  background-size:45px 45px;

  transform:
    perspective(500px)
    rotateX(60deg);

  animation:gridMove 5s linear infinite;

  opacity:.5;
}

@keyframes gridMove{

  to{
    transform:
      perspective(500px)
      rotateX(60deg)
      translateY(45px);
  }

}

.particles{
  position:absolute;
  inset:0;

  background-image:
    radial-gradient(
      circle,
      #00fff5 1px,
      transparent 2px
    ),
    radial-gradient(
      circle,
      #9d00ff 1px,
      transparent 2px
    );

  background-size:
    80px 80px,
    120px 120px;

  opacity:.3;

  animation:particlesMove 8s linear infinite;
}

@keyframes particlesMove{

  to{
    transform:translateY(-100px);
  }

}


/* =========================
   LOADING CONTENT
========================= */

.loader-content{
  position:relative;
  z-index:2;

  width:min(90%,430px);

  text-align:center;
}


/* =========================
   LOGO
========================= */

.loader-ring{

  width:125px;
  height:125px;

  margin:auto;
  padding:5px;

  border-radius:50%;

  background:
    conic-gradient(
      #00fff5,
      #9d00ff,
      #ff00ff,
      #00fff5
    );

  animation:spinRing 2s linear infinite;

  box-shadow:
    0 0 25px #00fff5,
    0 0 50px #9d00ff;
}

.loader-logo{

  width:100%;
  height:100%;

  border-radius:50%;

  background:#050509;

  display:flex;
  align-items:center;
  justify-content:center;
}

.loader-logo span{

  font-family:'Orbitron',sans-serif;

  font-size:60px;

  color:#fff;

  text-shadow:
    0 0 10px #00fff5,
    0 0 30px #9d00ff;

  animation:logoPulse 1s infinite alternate;
}

@keyframes spinRing{

  to{
    transform:rotate(360deg);
  }

}

@keyframes logoPulse{

  to{
    transform:scale(1.08);
  }

}


/* =========================
   NAMA VINZ SHOP
========================= */

.vinz-glitch{

  font-family:'Orbitron',sans-serif;

  font-size:
    clamp(34px,9vw,58px);

  letter-spacing:3px;

  margin:24px 0 5px;

  color:#fff;

  text-shadow:
    0 0 10px #00fff5,
    0 0 30px #9d00ff;

  animation:glitch 2s infinite;
}

@keyframes glitch{

  0%,90%,100%{
    transform:none;
  }

  92%{
    transform:translateX(-3px);
  }

  94%{
    transform:translateX(3px);
  }

}

.loader-sub{

  font-family:'Orbitron',sans-serif;

  font-size:11px;

  letter-spacing:6px;

  color:#9d00ff;

  text-shadow:0 0 12px #9d00ff;
}


/* =========================
   PROGRESS
========================= */

.loading-text{

  width:90%;

  margin:
    32px auto 8px;

  display:flex;

  justify-content:space-between;

  font-family:'Orbitron',sans-serif;

  font-size:9px;

  color:#00fff5;
}

.loading-bar{

  width:90%;

  height:7px;

  margin:auto;

  overflow:hidden;

  border-radius:20px;

  background:#ffffff12;

  border:
    1px solid
    #00fff555;
}

.loading-progress{

  width:0%;

  height:100%;

  border-radius:20px;

  background:
    linear-gradient(
      90deg,
      #00fff5,
      #9d00ff,
      #ff00ff
    );

  box-shadow:
    0 0 15px #00fff5;

  transition:
    width .1s linear;
}


/* =========================
   LOADING DOTS
========================= */

.loading-dots{
  margin-top:18px;
}

.loading-dots span{

  display:inline-block;

  width:6px;
  height:6px;

  margin:0 4px;

  border-radius:50%;

  background:#00fff5;

  animation:dotPulse 1s infinite;
}

.loading-dots span:nth-child(2){

  background:#9d00ff;

  animation-delay:.2s;
}

.loading-dots span:nth-child(3){

  background:#ff00ff;

  animation-delay:.4s;
}

@keyframes dotPulse{

  50%{
    transform:scale(1.6);
    opacity:.4;
  }

}


/* =========================
   NAVBAR
========================= */

nav{

  position:fixed;

  top:0;
  left:0;

  width:100%;

  z-index:90;

  padding:14px 5%;

  display:flex;

  align-items:center;

  justify-content:space-between;

  background:
    rgba(5,5,7,.94);

  border-bottom:
    1px solid
    #00fff533;

  backdrop-filter:blur(10px);
}

nav strong{

  font-family:'Orbitron',sans-serif;

  color:#00fff5;
}

nav a{

  color:#fff;

  text-decoration:none;

  font-size:11px;

  margin-left:15px;
}


/* =========================
   HERO
========================= */

.hero{

  min-height:100vh;

  display:flex;

  align-items:center;

  justify-content:center;

  text-align:center;

  padding:
    110px 5% 70px;

  background:
    radial-gradient(
      circle at 50% 45%,
      #36005a33,
      transparent 45%
    );
}

.tag{

  display:inline-block;

  padding:7px 15px;

  border:
    1px solid
    #ff00ff;

  border-radius:20px;

  color:#ff00ff;

  font-size:10px;
}

.glitch{

  font-size:
    clamp(38px,9vw,72px);

  margin:
    20px 0 10px;

  text-shadow:
    0 0 10px #00fff5,
    0 0 25px #9d00ff;
}

.purple{
  color:#9d00ff;
}

.muted{

  opacity:.6;

  font-size:12px;
}


/* =========================
   SECTION
========================= */

.section{

  padding:70px 5%;
}

.section-title{

  text-align:center;

  margin-bottom:35px;
}

.section-title h2{

  font-size:32px;

  color:#9d00ff;
}


/* =========================
   PRODUK
========================= */

.products{

  display:grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(220px,1fr)
    );

  gap:16px;

  max-width:950px;

  margin:auto;
}

.card{

  background:
    linear-gradient(
      145deg,
      #171722ee,
      #0b0b10ee
    );

  border:
    1px solid
    #9d00ff66;

  border-radius:18px;

  padding:22px;

  transition:.3s;
}

.card:hover{

  transform:
    translateY(-6px);

  box-shadow:
    0 0 25px
    #9d00ff33;
}

.price{

  color:#9d00ff;

  font-size:20px;

  font-weight:800;
}

.btn{

  display:block;

  text-align:center;

  margin-top:14px;

  padding:11px;

  border:
    2px solid
    #9d00ff;

  color:#9d00ff;

  border-radius:30px;

  text-decoration:none;

  font:
    600 11px Orbitron;
}

.btn:hover{

  background:#9d00ff;

  color:#fff;
}


/* =========================
   TRIAL
========================= */

.trial{

  background:
    #00ff8809;
}

.trial .card{

  border-color:
    #00ff8866;
}

.trial .price{

  color:#00ff88;
}


/* =========================
